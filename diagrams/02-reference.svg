<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-reference-title 02-reference-desc"><title id="02-reference-title">ToAPIs 02-reference image workflow</title><desc id="02-reference-desc">Source PNG → Upload URL → Prompt + URL → Task ID → Save PNG</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#657062"/></marker></defs><line x1="224" y1="160" x2="256" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><line x1="456" y1="160" x2="488" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><line x1="688" y1="160" x2="720" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><line x1="920" y1="160" x2="952" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="48" y="148" font-family="sans-serif" font-size="23" font-weight="600">Source PNG</text><text x="48" y="184" font-family="monospace" font-size="16" fill="#596058">Local file</text><rect x="264" y="100" width="192" height="120" rx="6" fill="#fff0df" stroke="#706d65"/><text x="280" y="148" font-family="sans-serif" font-size="23" font-weight="600">Upload URL</text><text x="280" y="184" font-family="monospace" font-size="16" fill="#596058">POST upload</text><rect x="496" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="512" y="148" font-family="sans-serif" font-size="23" font-weight="600">Prompt + URL</text><text x="512" y="184" font-family="monospace" font-size="16" fill="#596058">reference_images</text><rect x="728" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="744" y="148" font-family="sans-serif" font-size="23" font-weight="600">Task ID</text><text x="744" y="184" font-family="monospace" font-size="16" fill="#596058">Poll generation</text><rect x="960" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="976" y="148" font-family="sans-serif" font-size="23" font-weight="600">Save PNG</text><text x="976" y="184" font-family="monospace" font-size="16" fill="#596058">New output</text><text x="32" y="280" font-family="sans-serif" font-size="18" fill="#596058">A reference image is uploaded; editing uses the generations route with reference_images.</text></svg>