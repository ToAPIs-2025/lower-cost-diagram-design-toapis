<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-async-title 01-async-desc"><title id="01-async-title">ToAPIs 01-async image workflow</title><desc id="01-async-desc">Request → Task ID → GET status → Image URL → Save PNG</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#657062"/></marker></defs><line x1="224" y1="160" x2="256" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><line x1="456" y1="160" x2="488" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><line x1="688" y1="160" x2="720" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><line x1="920" y1="160" x2="952" y2="160" stroke="#657062" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="48" y="148" font-family="sans-serif" font-size="23" font-weight="600">Request</text><text x="48" y="184" font-family="monospace" font-size="16" fill="#596058">Bearer key</text><rect x="264" y="100" width="192" height="120" rx="6" fill="#fff0df" stroke="#706d65"/><text x="280" y="148" font-family="sans-serif" font-size="23" font-weight="600">Task ID</text><text x="280" y="184" font-family="monospace" font-size="16" fill="#596058">POST generation</text><rect x="496" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="512" y="148" font-family="sans-serif" font-size="23" font-weight="600">GET status</text><text x="512" y="184" font-family="monospace" font-size="16" fill="#596058">Poll existing ID</text><rect x="728" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="744" y="148" font-family="sans-serif" font-size="23" font-weight="600">Image URL</text><text x="744" y="184" font-family="monospace" font-size="16" fill="#596058">No auth header</text><rect x="960" y="100" width="192" height="120" rx="6" fill="#fffdf8" stroke="#706d65"/><text x="976" y="148" font-family="sans-serif" font-size="23" font-weight="600">Save PNG</text><text x="976" y="184" font-family="monospace" font-size="16" fill="#596058">SHA256 check</text><text x="32" y="280" font-family="sans-serif" font-size="18" fill="#596058">Generation POST happens once; subsequent requests query the saved task.</text></svg>